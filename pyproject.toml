[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmi_openlisem"
version = "1.0.0"
description = "BMI wrapper for OpenLISEM hydrological model"
license = "GPL-3.0-or-later"
authors = [
    {name = "Victor Jetten", email = "v.g.jetten@utwente.nl"},
]
keywords = ["hydrology", "erosion", "BMI", "CSDMS", "OpenLISEM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.8"
dependencies = ["numpy>=1.20.0"]

[project.optional-dependencies]
full = ["scipy>=1.7.0"]

[project.scripts]
bmi-openlisem = "bmi_openlisem.cli:main"

[tool.setuptools.packages.find]
include = ["bmi_openlisem*"]
